[project]
name = "go-to-ai-engineering"
version = "0.1.0"
description = ""
authors = [
    {name = "Danil Sheen",email = "dan.80956@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv (>=1.2.4,<2.0.0)",
    "openai (>=3.24.0,<4.0.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
    "sentence-transformers (>=6.2.0,<7.0.0)",
    "pgvector (>=0.5.1,<0.6.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "fastapi (>=0.162.6,<0.163.0)",
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 80
exclude = ["venv", ".venv", "migrations", "__pycache__", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "C", "B", "I"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"